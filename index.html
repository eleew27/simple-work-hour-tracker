<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes heures</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f6f5e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#77756e;--ac:#2f6f5e;--ac2:#e0eee9;--wa:#c98a1b;--rd:#b64a3a;--bd:#e4e1d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161715;--card:#222320;--tx:#f0efe9;--mut:#9a988f;--ac:#6fc2a9;--ac2:#27332f;--wa:#e0a73c;--rd:#e07a69;--bd:#33342f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161715;--card:#222320;--tx:#f0efe9;--mut:#9a988f;--ac:#6fc2a9;--ac2:#27332f;--wa:#e0a73c;--rd:#e07a69;--bd:#33342f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:15px;font-weight:600;color:var(--mut);text-transform:capitalize;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:14px}
.big{font-size:40px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.sub{color:var(--mut);font-size:14px;margin-top:2px}
.bar{height:16px;background:var(--ac2);border-radius:99px;overflow:hidden;margin:14px 0 8px}
.bar i{display:block;height:100%;background:#f28c28;border-radius:99px;transition:width .4s,background .4s}
.bar i.done{background:#2e9d57}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bar i{background:#f5a04a}:root:not([data-theme="light"]) .bar i.done{background:#5cd08a}}
.row{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}
.timer{font-size:48px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:2px 0}
.state{text-align:center;color:var(--mut);font-size:14px;margin-bottom:16px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;font-weight:600;font-size:17px;border:0;border-radius:14px;padding:16px;color:#fff;cursor:pointer}
button:disabled{opacity:.3;cursor:default}
#start{background:var(--ac)}
#end{background:var(--rd)}
.day{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--bd);font-size:15px}
.day:first-of-type{border-top:0}
.day small{color:var(--mut);display:block;font-size:12px}
.day b{font-variant-numeric:tabular-nums}
.x{background:none;color:var(--mut);font-size:18px;padding:4px 8px;margin-left:6px}
h2{font-size:15px;margin:0 0 6px}
.empty{color:var(--mut);font-size:14px}
[hidden]{display:none!important}
.tabs{display:flex;gap:6px;background:var(--ac2);padding:4px;border-radius:14px;margin-bottom:16px}
.tabs button{flex:1;background:none;color:var(--mut);font-size:15px;padding:10px;border-radius:11px}
.tabs button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.head h2{margin:0}
.mini{background:var(--ac2);color:var(--ac);font-size:14px;padding:8px 12px;border-radius:10px}
.form{display:grid;gap:10px;padding:12px 0 8px}
.form label{font-size:13px;color:var(--mut);display:grid;gap:4px}
.form input{font:inherit;font-size:16px;width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#fsave{background:var(--ac)}
summary{list-style:none;cursor:pointer}
summary::-webkit-details-marker{display:none}
.sh{display:flex;justify-content:space-between;font-size:16px;text-transform:capitalize}
.sh b{font-variant-numeric:tabular-nums;text-transform:none}
.dl{margin-top:8px}
.stale{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:13px;color:var(--wa);margin:-8px 0 14px;text-align:center}
.stale input,textarea{font:inherit;font-size:16px;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
textarea{width:100%;font-size:14px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:12px 14px;border-radius:12px;font-size:14px;text-align:center;z-index:20}
.btns .mini{padding:12px;font-size:15px}
.gin{font:inherit;font-size:16px;width:90px;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
#impGo{background:var(--ac)}
#goalIn{font:inherit;font-size:16px;width:100px;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
</style>
</head>
<body>
<main>
  <div class="tabs"><button id="t-now" class="on">Aujourd’hui</button><button id="t-hist">Historique</button></div>
  <section id="v-now">
  <h1 id="month"></h1>
  <div class="card">
    <div class="big"><span id="tot">0h 00</span> <span id="goalBtn" style="font-size:18px;color:var(--mut);font-weight:500;cursor:pointer">/ <span id="goalTxt">140</span> h ✎</span></div>
    <div class="bar"><i id="fill" style="width:0%"></i></div>
    <div class="row"><span id="pct">0 %</span><span id="left"></span></div>
    <div id="goalForm" class="head" style="margin:14px 0 0" hidden><span style="font-size:14px;color:var(--mut)">Objectif (heures)</span><span><input type="text" id="goalIn" inputmode="decimal"> <button id="goalSave" class="mini">OK</button></span></div>
  </div>
  <div class="card">
    <div class="timer" id="timer">0:00:00</div>
    <div class="state" id="state">Journée non commencée</div>
    <div id="stale" class="stale" hidden><span>Session commencée un autre jour. Heure de fin :</span><input type="time" id="staleEnd" value="17:00"></div>
    <div class="btns">
      <button id="start">▶ Début</button>
      <button id="end" disabled>⏹ Fin</button>
    </div>
  </div>
  <div class="card">
    <div class="head"><h2>Aujourd’hui · <span id="dayTot">0h 00</span></h2><button id="addToggle" class="mini">+ Ajouter des heures</button></div>
    <div id="addForm" class="form" hidden>
      <label>Date<input type="date" id="fd"></label>
      <div class="two"><label>Début<input type="time" id="fs" value="09:00"></label><label>Fin<input type="time" id="fe" value="17:00"></label></div>
      <button id="fsave">Enregistrer</button>
    </div>
    <div id="list"></div>
  </div>
  </section>
  <section id="v-hist" hidden>
    <div class="head" style="margin-bottom:12px"><h1 style="margin:0">Historique des mois</h1><button id="histAdd" class="mini">+ Ajouter une journée</button></div>
    <div id="hist"></div>
    <div class="card">
      <div class="head"><h2>Sauvegarde</h2></div>
      <div class="sub" style="margin-bottom:12px">Tes données restent dans ce navigateur. Exporte-les de temps en temps.</div>
      <div class="btns"><button id="exp" class="mini">⬇ Exporter (CSV)</button><button id="impToggle" class="mini">⬆ Importer</button></div>
      <div id="impBox" class="form" hidden>
        <input type="file" id="impFile" accept=".csv,text/csv,text/plain">
        <textarea id="impTxt" rows="5" placeholder="Ou colle ici le contenu du CSV"></textarea>
        <button id="impGo">Importer</button>
      </div>
    </div>
  </section>
</main>
<div id="toast" hidden></div>
<script>
const KEY="heures-v1", GKEY="heures-goals", DEF=140; let GOALS={};
try{const g=JSON.parse(localStorage.getItem(GKEY)||"{}");if(g&&typeof g=="object")GOALS=g}catch(e){}
function goalFor(k){const v=+GOALS[k];return v>0?v:DEF}
function parseGoal(s){const v=parseFloat(String(s).replace(",","."));return v>0&&v<=744?v:null}
function setGoal(k,v){GOALS[k]=v;try{localStorage.setItem(GKEY,JSON.stringify(GOALS))}catch(e){}dirty=true;render()}
let S={sessions:[],cur:null};
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)||S}catch(e){}
if(!S.sessions)S.sessions=[];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const worked=(s,now)=>{const end=s.end||now;let t=end-s.start;for(const p of s.pauses){t-=(p.e||end)-p.s}return Math.max(0,t)};
const fmtH=ms=>{const m=Math.floor(ms/60000);return Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")};
const fmtT=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/3600)+":"+String(Math.floor(s/60)%60).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
const fmtClock=t=>new Date(t).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
const sameMonth=(t,n)=>{const a=new Date(t),b=new Date(n);return a.getFullYear()==b.getFullYear()&&a.getMonth()==b.getMonth()};
function act(a){
  const now=Date.now();
  if(a=="start"&&!S.cur)S.cur={start:now,pauses:[]};
  else if(a=="end"&&S.cur){
    let e=now;
    if(!sameDay(S.cur.start,now)){
      const m=/^(\d{1,2}):(\d{2})$/.exec($("staleEnd").value||"");
      if(!m)return toast("Indique l’heure de fin de cette session.");
      const d=new Date(S.cur.start);d.setHours(+m[1],+m[2],0,0);
      if(d.getTime()<=S.cur.start)return toast("L’heure de fin doit être après le début.");
      e=d.getTime();
    }
    const l=S.cur.pauses[S.cur.pauses.length-1];if(l&&!l.e)l.e=e;
    S.cur.end=e;S.sessions.push(S.cur);S.cur=null;
  }
  save();dirty=true;render();
}
let dirty=true,lastSig=null,editI=null;const openM=new Set();
function vis(p,t){return t>0?Math.max(p,2):0}
function sameDay(t,n){return new Date(t).toDateString()==new Date(n).toDateString()}
function del(i){S.sessions.splice(i,1);save();dirty=true;render()}
function toast(t){const e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{e.hidden=true},3500)}
function edit(i){
  const s=S.sessions[i];if(!s)return;
  editI=i;tab(false);
  const a=new Date(s.start),b=new Date(s.end);
  $("fd").max=ymd(new Date());$("fd").value=ymd(a);
  $("fs").value=pad(a.getHours())+":"+pad(a.getMinutes());
  $("fe").value=pad(b.getHours())+":"+pad(b.getMinutes());
  $("fsave").textContent="Enregistrer les modifications";
  $("addForm").hidden=false;
  $("addForm").scrollIntoView({behavior:"smooth",block:"center"});
}
function csvOf(){
  const rows=["date,debut,fin,minutes"];
  S.sessions.slice().sort((a,b)=>a.start-b.start).forEach(s=>{
    const d=new Date(s.start),e=new Date(s.end);
    rows.push([ymd(d),pad(d.getHours())+":"+pad(d.getMinutes()),pad(e.getHours())+":"+pad(e.getMinutes()),Math.round(worked(s,s.end)/60000)].join(","));
  });
  return rows.join("\n");
}
function importCsv(txt){
  let n=0;
  txt.split(/\r?\n/).forEach(line=>{
    const c=line.trim().split(/[,;]/);
    if(c.length<3||!/^\d{4}-\d{2}-\d{2}$/.test(c[0]))return;
    const s=new Date(c[0]+"T"+c[1]).getTime();let e=new Date(c[0]+"T"+c[2]).getTime();
    if(isNaN(s)||isNaN(e))return;
    if(e<=s)e+=864e5;
    if(S.sessions.some(x=>x.start==s))return;
    const mins=(c[3]!==undefined&&c[3]!=="")?+c[3]:null;
    const diff=mins===null?0:(e-s)/60000-mins;
    S.sessions.push({start:s,end:e,pauses:diff>0.5?[{s:s,e:s+diff*60000}]:[]});
    n++;
  });
  save();dirty=true;render();return n;
}
function dayEl(o,now){
  const el=document.createElement("div");el.className="day";
  const dt=new Date(o.s.start).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"});
  el.innerHTML='<div>'+dt+'<small>'+fmtClock(o.s.start)+' → '+fmtClock(o.s.end)+(o.s.manual?' · manuel':'')+'</small></div><div><b>'+fmtH(worked(o.s,now))+'</b><button class="x ed" aria-label="Modifier">✎</button><button class="x dx" aria-label="Supprimer">✕</button></div>';
  el.querySelector(".ed").onclick=()=>edit(o.i);
  const dx=el.querySelector(".dx");let armed=false;
  dx.onclick=()=>{if(!armed){armed=true;dx.textContent="Sûr ?";dx.style.color="var(--rd)";setTimeout(()=>{armed=false;dx.textContent="✕";dx.style.color=""},3000)}else del(o.i)};
  return el;
}
function mkey(t){const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function renderHist(){
  const now=Date.now(),by={};
  S.sessions.forEach((s,i)=>{const k=mkey(s.start);(by[k]=by[k]||[]).push({s,i})});
  const ck=mkey(now);if(!by[ck])by[ck]=[];
  const box=$("hist");box.innerHTML="";
  Object.keys(by).sort().reverse().forEach(k=>{
    const arr=by[k].sort((a,b)=>b.s.start-a.s.start);
    let tot=arr.reduce((t,o)=>t+worked(o.s,now),0);
    if(k==ck&&S.cur)tot+=worked(S.cur,now);
    const G=goalFor(k);
    const pct=Math.min(100,tot/3600000/G*100);
    const [y,m]=k.split("-");
    const name=new Date(+y,+m-1,1).toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
    const det=document.createElement("details");det.className="card";det.open=openM.has(k);
    det.innerHTML='<summary><div class="sh"><span>'+name+'</span><b>'+fmtH(tot)+' / '+G+' h</b></div><div class="bar"><i class="'+(pct>=100?'done':'')+'" style="width:'+vis(pct,tot)+'%"></i></div><div class="row"><span>'+pct.toFixed(1).replace(".",",")+' %</span><span>'+arr.length+' jour'+(arr.length>1?'s':'')+'</span></div></summary><div class="dl"></div>';
    const dl=det.querySelector(".dl");
    const gr=document.createElement("div");gr.className="head";
    gr.innerHTML='<span class="sub">Objectif du mois (h)</span><span><input class="gin" type="text" inputmode="decimal" value="'+String(G).replace(".",",")+'"> <button class="mini">OK</button></span>';
    gr.querySelector("button").onclick=()=>{const v=parseGoal(gr.querySelector("input").value);if(!v)return toast("Indique un nombre d’heures valide.");setGoal(k,v);toast("Objectif : "+String(v).replace(".",",")+" h")};
    dl.appendChild(gr);
    if(arr.length)arr.forEach(o=>dl.appendChild(dayEl(o,now)));else dl.insertAdjacentHTML("beforeend",'<div class="empty">Aucune journée.</div>');
    det.addEventListener("toggle",()=>{det.open?openM.add(k):openM.delete(k)});
    box.appendChild(det);
  });
}
function tab(h){$("v-now").hidden=h;$("v-hist").hidden=!h;$("t-now").classList.toggle("on",!h);$("t-hist").classList.toggle("on",h);dirty=true;render()}
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function render(){
  const now=Date.now();
  const d=new Date(now);
  $("month").textContent=d.toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
  let tot=0;
  S.sessions.forEach(s=>{if(sameMonth(s.start,now))tot+=worked(s,now)});
  if(S.cur)tot+=worked(S.cur,now);
  const G=goalFor(mkey(now));
  const pct=Math.min(100,tot/3600000/G*100);
  $("tot").textContent=fmtH(tot);
  $("goalTxt").textContent=String(G).replace(".",",");
  $("fill").style.width=vis(pct,tot)+"%";
  $("fill").classList.toggle("done",pct>=100);
  $("pct").textContent=pct.toFixed(1).replace(".",",")+" %";
  const left=G*3600000-tot;
  $("left").textContent=left>0?"Reste "+fmtH(left):"Objectif atteint 🎉";
  const c=S.cur;
  $("timer").textContent=fmtT(c?worked(c,now):0);
  $("state").textContent=!c?"Aucune session en cours":"Début à "+fmtClock(c.start);
  $("start").disabled=!!c;
  $("end").disabled=!c;
  $("stale").hidden=!(c&&!sameDay(c.start,now));
  const items=S.sessions.map((s,i)=>({s,i})).filter(o=>sameDay(o.s.start,now)).sort((a,b)=>b.s.start-a.s.start);
  $("dayTot").textContent=fmtH(items.reduce((t,o)=>t+worked(o.s,now),0)+(c?worked(c,now):0));
  const sig=items.map(o=>o.i+"_"+o.s.start+"_"+o.s.end).join("|");
  if(sig!==lastSig){
    lastSig=sig;
    $("list").innerHTML=items.length?"":'<div class="empty">Aucun enregistrement aujourd’hui.</div>';
    items.forEach(o=>$("list").appendChild(dayEl(o,now)));
  }
  if(dirty&&!$("v-hist").hidden){renderHist();dirty=false}
}
$("start").onclick=()=>act("start");
$("end").onclick=()=>act("end");
$("t-now").onclick=()=>tab(false);
$("t-hist").onclick=()=>tab(true);
$("addToggle").onclick=()=>{const f=$("addForm");f.hidden=!f.hidden;editI=null;$("fsave").textContent="Enregistrer";if(!f.hidden){const d=new Date();$("fd").max=ymd(d);if(!$("fd").value)$("fd").value=ymd(d)}};
$("fsave").onclick=()=>{
  const d=$("fd").value,a=$("fs").value,b=$("fe").value;
  if(!d||!a||!b)return toast("Remplis la date, le début et la fin.");
  const s=new Date(d+"T"+a).getTime(),e=new Date(d+"T"+b).getTime();
  if(!(e>s))return toast("La fin doit être après le début.");
  const rec={start:s,end:e,pauses:[],manual:true};if(editI!==null&&S.sessions[editI])S.sessions[editI]=rec;else S.sessions.push(rec);editI=null;$("fsave").textContent="Enregistrer";
  save();dirty=true;$("addForm").hidden=true;render();if(!sameDay(s,Date.now()))tab(true);toast("Enregistré.");
};
$("goalBtn").onclick=()=>{const f=$("goalForm");f.hidden=!f.hidden;$("goalIn").value=String(goalFor(mkey(Date.now()))).replace(".",",")};
$("goalSave").onclick=()=>{const v=parseGoal($("goalIn").value);if(!v)return toast("Indique un nombre d’heures valide.");$("goalForm").hidden=true;setGoal(mkey(Date.now()),v);toast("Objectif : "+String(v).replace(".",",")+" h")};
$("histAdd").onclick=()=>{editI=null;tab(false);$("fsave").textContent="Enregistrer";const y=new Date();y.setDate(y.getDate()-1);$("fd").max=ymd(new Date());$("fd").value=ymd(y);$("addForm").hidden=false;$("addForm").scrollIntoView({behavior:"smooth",block:"center"})};
$("exp").onclick=async()=>{
  const csv=csvOf();
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="heures-"+ymd(new Date())+".csv";document.body.appendChild(a);a.click();a.remove();toast("Fichier exporté.");return}catch(e){}
  $("impBox").hidden=false;$("impTxt").value=csv;$("impTxt").select();toast("Copie ce texte pour le garder.");
};
$("impToggle").onclick=()=>{$("impBox").hidden=!$("impBox").hidden};
$("impFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$("impTxt").value=r.result};r.readAsText(f)};
$("impGo").onclick=()=>{const n=importCsv($("impTxt").value);toast(n?n+" entrée"+(n>1?"s":"")+" importée"+(n>1?"s":"")+".":"Rien de nouveau à importer.");if(n){$("impTxt").value="";$("impBox").hidden=true}};
const qa=new URLSearchParams(location.search).get("action");
if(qa=="start"&&!S.cur)act("start");
else if(qa=="end"&&S.cur&&sameDay(S.cur.start,Date.now()))act("end");
if(qa)try{history.replaceState(null,"",location.pathname)}catch(e){}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
render();setInterval(render,1000);
</script>
</body>
</html>
